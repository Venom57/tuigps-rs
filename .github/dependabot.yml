version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@1.88 on purpose; the ref is
      # the Rust version, not the action's version.
      - dependency-name: dtolnay/rust-toolchain
