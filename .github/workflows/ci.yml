name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            features: ""
          - name: no default features
            features: "--no-default-features"
          - name: all features
            features: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked ${{ matrix.features }}
      - run: cargo test --all-targets --locked ${{ matrix.features }}
      - run: cargo build --release --locked ${{ matrix.features }}
      - run: cargo doc --no-deps --locked ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # `+1.88` overrides rust-toolchain.toml (which pins stable).
      - run: cargo +1.88 check --all-targets --locked
      - run: cargo +1.88 check --all-targets --locked --all-features

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
