# cargo-deny configuration. Run locally with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms we build and ship for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained and yanked crates (cargo-deny defaults).
ignore = [
    # zbus 5 internals, folded into zbus 6 (which needs Rust 1.89, above our
    # 1.88 MSRV). zbus is only reachable via the stub `dbus` feature, which
    # never calls it. Bump to zbus 6 when implementing D-Bus or raising MSRV.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: optional stub dbus feature; fix needs MSRV 1.89" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: optional stub dbus feature; fix needs MSRV 1.89" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: optional stub dbus feature; fix needs MSRV 1.89" },
]

[licenses]
# Licenses actually present in the dependency tree. For `A OR B` expressions
# only one side needs to be allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0", # unicode-ident
    "Zlib",        # foldhash
]
confidence-threshold = 0.8

[licenses.private]
# Skip our own (unpublished) crate.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
