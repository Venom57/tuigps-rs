# cargo-deny configuration. Run locally with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms we build and ship for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained and yanked crates (cargo-deny defaults).
ignore = [
    # paste is unmaintained (archived); pulled in by ratatui 0.29 with no
    # upgrade path yet. Revisit when bumping ratatui.
    { id = "RUSTSEC-2024-0436", reason = "transitive via ratatui 0.29; no fix available" },
]

[licenses]
# Licenses actually present in the dependency tree. For `A OR B` expressions
# only one side needs to be allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0", # unicode-ident
    "Zlib",        # foldhash
]
confidence-threshold = 0.8

[licenses.private]
# Skip our own (unpublished) crate.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
