[package]
name = "tuigps-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI GPS monitor for gpsd: position, satellites, timing, NMEA and u-blox config"
repository = "https://github.com/Venom57/tuigps-rs"
readme = "README.md"
keywords = ["gps", "gpsd", "gnss", "tui", "ratatui"]
categories = ["command-line-utilities", "science::geo"]
# No license has been chosen yet (no LICENSE file), so keep this off crates.io.
# Also lets cargo-deny skip the unlicensed root crate.
publish = false

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "process",
] }

# gpsd JSON parsing (serde_json::Value only)
serde_json = "1"

# Date/time
chrono = "0.4"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# D-Bus for clock sync (stub, not yet implemented)
zbus = { version = "5", optional = true }

# Open URLs in browser
open = "5"

# Error handling
anyhow = "1"

# Async stream for crossterm events
futures = "0.3"

# Config file (~/.config/tuigps-rs/config.toml)
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

# D-Bus clock sync via zbus. Currently a stub that always falls through to
# timedatectl / sudo date, so it is off by default.
[features]
default = []
dbus = ["dep:zbus"]

[dev-dependencies]
tempfile = "3"
quick-xml = "0.42"
csv = "1"
proptest = "1"
